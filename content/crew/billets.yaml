# Every job aboard, how many people hold it, and where they work (Act 1 spec §4).
# The named crew (characters.yaml) take their billets first; everyone else is generated from
# `seed`, so the crew is the same in every game. Checked by `npm run validate`.
#
#   watch: rotating = one holder per watch section A, B, C (count is a multiple of 3);
#          day = works days, sleeps at night; A, B or C = always that section.
#   station: the room they work in (an id from content/ship/deck*.yaml).
#   post: the furniture they use there (helm, console, console-seat, range, desk...).
#   patrol: rooms they make rounds of on duty instead of staying put.
#
# 9 officers + 6 chiefs + 24 petty officers + 48 junior enlisted + 12 marines = 99,
# plus the captain: a crew of 100.

seed: 1701

billets:
  # ---- Command ---------------------------------------------------------------------------
  - id: executive-officer
    title: Executive officer
    department: command
    group: officer
    count: 1
    watch: day
    station: bridge
    ranks: [Lt. Cmdr.]

  - id: master-chief
    title: Master Chief of the ship
    department: command
    group: chief
    count: 1
    watch: day
    station: crew-mess
    patrol: [crew-mess, junior-berthing-a, passage-2, hangar, junior-berthing-b, passage-3]
    ranks: [Master Chief]

  - id: yeoman
    title: Yeoman
    department: command
    group: petty-officer
    count: 1
    watch: day
    station: ships-office
    post: desk
    ranks: [Yeoman]

