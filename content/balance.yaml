# Every tunable number in the game lives here. Checked by `npm run validate`.

player:
  walkSpeed: 3.0 # metres per second
  runMultiplier: 1.6 # speed multiplier while Shift is held
  acceleration: 10 # how quickly speed catches up with input (per second)
  eyeHeight: 1.65 # metres above the deck
  bodyHeight: 1.8 # metres
  radius: 0.3 # metres; corridors are about 1.2 m wide
  mouseSensitivity: 0.0022 # radians per pixel of mouse movement
  fieldOfView: 58 # vertical, in degrees (about 90° horizontal at 16:9)

time:
  start: '07:50' # the game starts ten minutes before the 0800 change of watch
  minutesPerSecond: 0.5 # ship minutes per real second: a day takes 48 minutes

crew:
  walkSpeed: 1.3 # metres per second, give or take 15% per person
  climbSeconds: 5 # to climb one deck by ladder, out of sight

# Where the captain stands on day one (design doc §5). Meters change only through effects.
command:
  budget: 6000 # discretionary budget, credits (₡)
  readiness: 52 # combat readiness, %: an old, short-handed ship
  crew: 45 # crew relations (enlisted morale), 0–100: Steady, but unsettled
  highCommand: 0 # High Command standing, −100…+100: Unremarkable
  fatigue: 20 # crew-wide fatigue, 0–100
  # Relations (−100…+100) with named characters who don't start at 0, by character id.
  relations:
    okafor: -10 # wanted this command herself
